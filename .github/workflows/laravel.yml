name: Laravel CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clone Code
      uses: actions/checkout@v3

    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: 📦 Install Dependencies
      run: composer install

    - name: ⚙️ Setup Env
      run: cp .env.example .env

    - name: 🔑 Generate Key
      run: php artisan key:generate

    - name: 🧪 Run Tests
      run: php artisan test
